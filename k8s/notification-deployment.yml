apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-deployment
  labels:
    name: notification-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
    spec:
      containers:
        - image: notifications
          name: notification-server
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "150m"
              memory: "150Mi"
            limits:
              cpu: "300m"
              memory: "300Mi"
          livenessProbe:
            httpGet:
              path: /_status/healthz
              port: 3000
            initialDelaySeconds: 90
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /_status/healthz
              port: 3000
            initialDelaySeconds: 30
            timeoutSeconds: 10

          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: database
                  key: RABBITMQ_URL

            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: google
                  key: GOOGLE_CLIENT_ID

            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: google
                  key: GOOGLE_CLIENT_SECRET

            - name: GOOGLE_REFRESH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: google
                  key: GOOGLE_REFRESH_TOKEN

            - name: EMAIL_USER
              valueFrom:
                secretKeyRef:
                  name: google
                  key: EMAIL_USER
          ports:
            - containerPort: 3000
              name: noti-port
